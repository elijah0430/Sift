<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 420" role="img" aria-labelledby="title desc">
  <title id="title">The Sift research workflow</title>
  <desc id="desc">Work freely in scratch, run and compare experiments, save experiment code that matters, and send reusable code through human review before it enters core.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 10 5 0 10z" fill="#64748b"/>
    </marker>
    <linearGradient id="accent" x1="0" x2="1">
      <stop offset="0" stop-color="#7c3aed"/>
      <stop offset="1" stop-color="#06b6d4"/>
    </linearGradient>
  </defs>
  <rect width="1000" height="420" rx="22" fill="#0b1020"/>
  <g fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)">
    <path d="M215 105H300"/>
    <path d="M535 105H620"/>
    <path d="M747 155V225H505V270"/>
    <path d="M747 155V270"/>
    <path d="M590 320H650"/>
    <path d="M830 320H870"/>
  </g>
  <g font-family="Inter,Segoe UI,sans-serif">
    <g stroke-width="1.5">
      <rect x="35" y="55" width="180" height="100" rx="14" fill="#17132e" stroke="url(#accent)"/>
      <rect x="300" y="55" width="235" height="100" rx="14" fill="#111b30" stroke="#7c3aed"/>
      <rect x="620" y="55" width="255" height="100" rx="14" fill="#111b30" stroke="#a78bfa"/>
      <rect x="380" y="270" width="210" height="100" rx="14" fill="#111b30" stroke="#334155"/>
      <rect x="650" y="270" width="180" height="100" rx="14" fill="#17132e" stroke="#a78bfa"/>
      <rect x="870" y="270" width="95" height="100" rx="14" fill="#102634" stroke="#22d3ee"/>
    </g>
    <g fill="#f8fafc" font-size="21" font-weight="700">
      <text x="58" y="96">Scratch</text>
      <text x="323" y="96">Experiment run</text>
      <text x="643" y="96">Compare experiments</text>
      <text x="403" y="311">Saved experiment</text>
      <text x="673" y="311">Core change</text>
      <text x="893" y="311" fill="#67e8f9">Core</text>
    </g>
    <g fill="#94a3b8" font-size="13.5">
      <text x="58" y="125">Try uncertain ideas</text>
      <text x="323" y="125">Code · inputs · outputs</text>
      <text x="643" y="125">Configuration · metrics · status</text>
      <text x="403" y="340">Keep code needed for reruns</text>
      <text x="673" y="340" fill="#c4b5fd">Human review</text>
      <text x="893" y="340">Reuse</text>
    </g>
  </g>
</svg>
