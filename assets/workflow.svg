<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 445" role="img" aria-labelledby="title desc">
  <title id="title">The Sift research code lifecycle</title>
  <desc id="desc">Scratch can become a recorded run, a preserved experiment, a reviewed core promotion, or a recoverable archive. Recorded runs can be replayed to verify their declared results.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 10 5 0 10z" fill="#64748b"/>
    </marker>
    <linearGradient id="accent" x1="0" x2="1">
      <stop offset="0" stop-color="#7c3aed"/>
      <stop offset="1" stop-color="#06b6d4"/>
    </linearGradient>
  </defs>
  <rect width="1000" height="445" rx="22" fill="#0b1020"/>
  <g fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)">
    <path d="M205 200C255 200 245 77 300 77"/>
    <path d="M520 77H740"/>
    <path d="M205 200H300"/>
    <path d="M520 207H580"/>
    <path d="M730 207H800"/>
    <path d="M205 200C255 200 245 337 300 337"/>
    <path d="M120 250V401Q120 420 140 420H830Q853 420 853 380"/>
  </g>
  <g font-family="Inter,Segoe UI,sans-serif">
    <rect x="35" y="150" width="170" height="100" rx="14" fill="#17132e" stroke="url(#accent)" stroke-width="2"/>
    <text x="58" y="191" fill="#f8fafc" font-size="23" font-weight="700">Scratch</text>
    <text x="58" y="218" fill="#c4b5fd" font-size="14">Explore an idea</text>
    <g fill="#111b30" stroke="#334155" stroke-width="1.3">
      <rect x="300" y="35" width="220" height="85" rx="12"/>
      <rect x="740" y="35" width="225" height="85" rx="12"/>
      <rect x="300" y="165" width="220" height="85" rx="12"/>
      <rect x="580" y="165" width="150" height="85" rx="12" stroke="#a78bfa"/>
      <rect x="800" y="165" width="165" height="85" rx="12" stroke="#22d3ee"/>
      <rect x="300" y="295" width="220" height="85" rx="12"/>
      <rect x="740" y="295" width="225" height="85" rx="12"/>
    </g>
    <g fill="#f1f5f9" font-size="18" font-weight="600">
      <text x="320" y="69">Recorded run</text>
      <text x="760" y="69">Replay</text>
      <text x="320" y="199">Promotion candidate</text>
      <text x="596" y="199" fill="#c4b5fd">Human review</text>
      <text x="820" y="199" fill="#67e8f9">Core</text>
      <text x="320" y="329">Experiment recipe</text>
      <text x="760" y="329">Recoverable archive</text>
    </g>
    <g fill="#94a3b8" font-size="13">
      <text x="320" y="94">Source · inputs · outputs</text>
      <text x="760" y="94">Verify the declared result</text>
      <text x="320" y="224">Interface · patch · checks</text>
      <text x="596" y="224">Approve exact bytes</text>
      <text x="820" y="224">Supported capabilities</text>
      <text x="320" y="354">Preserve a specific procedure</text>
      <text x="760" y="354">Retire working files safely</text>
    </g>
  </g>
</svg>
