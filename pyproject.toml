[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "sift-research"
version = "0.6.0"
description = "Organize research code and reproduce experiments with coding agents"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Sift contributors" }]
keywords = ["research", "experiments", "reproducibility", "agents", "mlops"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Topic :: Scientific/Engineering",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.9"]

[project.scripts]
sift = "sift.cli:main"

[project.urls]
Homepage = "https://github.com/elijah0430/Sift"
Repository = "https://github.com/elijah0430/Sift"
Issues = "https://github.com/elijah0430/Sift/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/sift"]

[tool.hatch.build.targets.wheel.force-include]
"skills/sift" = "sift/bundled_skill"
"harness/policy.json" = "sift/bundled_harness/policy.json"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

